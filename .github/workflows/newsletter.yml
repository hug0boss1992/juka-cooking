name: Newsletter

# Jeden Sonntag 07:30 UTC (Winter 08:30, Sommer 09:30 deutscher Zeit): neue Rezepte seit dem
# letzten Versand per Brevo an die Newsletter-Liste schicken. Gibt es nichts Neues, geht keine Mail raus.
on:
  schedule:
    - cron: '30 7 * * 0'
  workflow_dispatch:
    inputs:
      aktion:
        description: 'einrichten, senden oder stand'
        required: true
        default: 'stand'
        type: choice
        options: [stand, einrichten, senden]

permissions: {}

concurrency:
  group: juka-pages
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Newsletter
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AKTION: ${{ inputs.aktion || 'senden' }}
        run: node scripts/newsletter.mjs "$AKTION"
      - name: Stand sichern
        run: |
          git add -- data/newsletter.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Newsletter-Stand aktualisieren'
            git pull --rebase -q
            git push
          fi
