name: Google-Bilder erzeugen

# Erzeugt für alle Rezepte große Bilder für Google (1:1, 4:3, 16:9, je 1200 px, Real-ESRGAN),
# baut die Rezeptseiten neu und veröffentlicht. Läuft, wenn sich das Skript ändert, oder von Hand.
# Neue Rezepte bekommen ihre Bilder danach automatisch im täglichen Lauf (feed.yml).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/make-google-images.py'
  workflow_dispatch:

permissions: {}

concurrency:
  group: juka-pages
  cancel-in-progress: false

jobs:
  bilder:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bilder erzeugen und Rezeptseiten neu bauen
        run: |
          pip install --quiet 'pillow==11.3.0' 'numpy<3' 'spandrel==0.4.1' torch --extra-index-url https://download.pytorch.org/whl/cpu
          python scripts/make-google-images.py --nur-neue
          node scripts/publish-recipes.mjs
      - name: Ergebnis sichern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- public/google-bilder/ public/rezepte/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Google-Bilder für Rezepte erzeugt'
            git pull --rebase --autostash
            git push
            gh workflow run feed.yml --ref main
          fi
