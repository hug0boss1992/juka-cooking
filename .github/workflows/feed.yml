name: Instagram-Feed und GitHub Pages

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:

permissions: {}

concurrency:
  group: juka-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tiktok-feed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Links und Bio aus links.md prüfen und bauen
        run: node scripts/build-site.mjs
      - name: Instagram-Beiträge abrufen
        id: sync
        if: github.event_name != 'push'
        env:
          BEHOLD_FEED_URL: ${{ vars.BEHOLD_FEED_URL }}
        run: |
          if [ -z "$BEHOLD_FEED_URL" ]; then
            echo '::notice::BEHOLD_FEED_URL fehlt. Die Seite wird mit dem vorhandenen Feed veröffentlicht.'
          else
            node scripts/update-feed.mjs
            git add -A -- public/
          fi
      - name: Änderungen und monatliches Lebenszeichen sichern
        if: ${{ !cancelled() && steps.sync.outcome != 'skipped' && steps.sync.outcome != '' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          if [ "$SYNC_OUTCOME" != 'success' ]; then
            git reset --quiet HEAD -- public/
          fi
          if [ "$EVENT_NAME" = 'schedule' ]; then
            date -u +%Y-%m > .feed-keepalive
            git add -- .feed-keepalive
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Instagram-Feed oder Monatsmarke aktualisieren'
            git push
          fi
      - name: TikTok-Mix für die Veröffentlichung erstellen
        if: vars.TIKTOK_ENABLED == 'true'
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_SECRET_WRITER: ${{ secrets.TIKTOK_SECRET_WRITER }}
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node scripts/update-tiktok.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
