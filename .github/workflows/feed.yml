name: Instagram-Feed und GitHub Pages

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:

permissions: {}

concurrency:
  group: juka-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tiktok-feed
    permissions:
      contents: write
      issues: write
    outputs:
      neue_adressen: ${{ steps.sitemap.outputs.neue }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Klickzähler wach halten (Supabase pausiert sonst nach 7 Tagen)
        continue-on-error: true
        run: curl -fsS --max-time 30 'https://qwfbzcbcfznctzyoqbky.supabase.co/functions/v1/klick?keepalive=1' || echo '::warning::Klickzähler nicht erreichbar'
      - name: Originale Partnerbilder lokal abrufen
        run: |
          node scripts/sync-brand-assets.mjs
          git add -A -- public/brands/
      - name: Links und Bio aus links.md prüfen und bauen
        run: node scripts/build-site.mjs
      - name: Instagram-Beiträge abrufen
        id: sync
        if: github.event_name != 'push'
        env:
          BEHOLD_FEED_URL: ${{ vars.BEHOLD_FEED_URL }}
        run: |
          if [ -z "$BEHOLD_FEED_URL" ]; then
            echo '::notice::BEHOLD_FEED_URL fehlt. Die Seite wird mit dem vorhandenen Feed veröffentlicht.'
          else
            node scripts/update-feed.mjs
            # Instagram-Follower stehen danach in mediakit.json → Kooperationsseite neu bauen
            node scripts/build-mediakit.mjs
            git add -A -- public/ data/ mediakit.json
          fi
      # Rezept-Bot: neue Beiträge mit Rezept prüfen, Bild hochauflösend machen (Real-ESRGAN über PyTorch),
      # Rezeptseite und Pinterest-Bild veröffentlichen. Pinterest holt neue Pins über
      # https://juka-cooking.de/rezepte/pinterest.xml ab. Unsicheres wird zurückgehalten und gemeldet.
      - name: Neue Rezepte suchen
        id: recipes
        if: github.event_name != 'push'
        run: echo "open=$(node scripts/recipe-bot.mjs offen)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.recipes.outputs.open != '' && steps.recipes.outputs.open != '0'
        with:
          python-version: '3.12'
      - name: Neue Rezepte automatisch veröffentlichen
        id: publish
        if: steps.recipes.outputs.open != '' && steps.recipes.outputs.open != '0'
        env:
          RECIPE_BOT_REPORT: ${{ runner.temp }}/rezept-bericht.md
        run: |
          # Real-ESRGAN (Fotomodell realesr-general-x4v3) über PyTorch auf dem Prozessor, ca. 15 s pro Bild
          pip install --quiet 'pillow==11.3.0' 'numpy<3' 'spandrel==0.4.1' torch --extra-index-url https://download.pytorch.org/whl/cpu
          node scripts/recipe-bot.mjs auto
          node scripts/publish-recipes.mjs
          python scripts/make-pin-images.py --nur-neue
          # Große Google-Bilder (1:1, 4:3, 16:9) für neue Rezepte, danach Seiten mit diesen Bildern neu bauen
          python scripts/make-google-images.py --nur-neue
          node scripts/publish-recipes.mjs
          git add -A -- data/ public/
          if [ -s "$RECIPE_BOT_REPORT" ]; then echo 'held=1' >> "$GITHUB_OUTPUT"; fi
      # Rezeptkarten aus data/pinterest-karten.json am geplanten Tag in die Pinterest-Feeds aufnehmen
      # (3 pro Tag). Läuft täglich, auch wenn es keine neuen Rezepte gibt.
      - name: Pinterest-Rezeptkarten freischalten
        if: github.event_name != 'push'
        run: |
          node scripts/publish-recipes.mjs
          git add -A -- public/rezepte/
      - name: Zurückgehaltene Rezepte melden
        if: steps.publish.outputs.held == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Rezept-Bot – Rezept zurückgehalten ($(date -u +%d.%m.%Y))" --body-file "$RUNNER_TEMP/rezept-bericht.md"
      - name: Sitemap für Suchmaschinen erzeugen
        id: sitemap
        run: |
          echo "neue=$(node scripts/build-sitemap.mjs --neue)" >> "$GITHUB_OUTPUT"
          git add -- public/sitemap.xml public/robots.txt
      - name: Änderungen und monatliches Lebenszeichen sichern
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = 'schedule' ]; then
            date -u +%Y-%m > .feed-keepalive
            git add -- .feed-keepalive
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Instagram-Feed oder Monatsmarke aktualisieren'
            git push
          fi
      - name: TikTok-Mix für die Veröffentlichung erstellen
        if: vars.TIKTOK_ENABLED == 'true'
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_SECRET_WRITER: ${{ secrets.TIKTOK_SECRET_WRITER }}
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node scripts/update-tiktok.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Neue Seiten an Suchmaschinen melden (IndexNow, u. a. Bing)
        if: needs.prepare.outputs.neue_adressen != '' && needs.prepare.outputs.neue_adressen != '[]'
        continue-on-error: true
        env:
          ADRESSEN: ${{ needs.prepare.outputs.neue_adressen }}
        run: |
          body=$(jq -nc --argjson urls "$ADRESSEN" '{host:"juka-cooking.de",key:"8fe91b288d3e3309f3f2eef339ee170b",keyLocation:"https://juka-cooking.de/8fe91b288d3e3309f3f2eef339ee170b.txt",urlList:$urls}')
          curl -sS --max-time 30 -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -H 'Content-Type: application/json; charset=utf-8' --data "$body" https://api.indexnow.org/indexnow
