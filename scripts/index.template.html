<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Justyna von Juka Cooking. Kreative Küche, einfache Rezepte und Kooperationen.">
  <meta name="theme-color" content="#f8f3e9">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Justyna · Juka Cooking</title>
  <link rel="stylesheet" href="styles.css">
  <script src="feed.js" defer></script>
</head>
<body id="start">
  <header class="site-header">
    <div class="wrap site-header-inner">
      <a class="brand" href="#start">juka<span>.</span>cooking</a>
      <nav class="section-links" aria-label="Seitennavigation">
        <a href="#beitraege">Beiträge</a>
        <!-- PARTNER_NAV -->
      </nav>
      <!-- PROFILE_NAV -->
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="profile-title">
      <div class="wrap profile">
        <div class="portrait">
          <img src="profil.jpg" alt="Porträt von Justyna" width="192" height="192">
        </div>
        <div class="profile-copy">
          <h1 id="profile-title">Justyna</h1>
          <p class="handle">@juka.cooking</p>
          <p class="bio"><!-- BIO --></p>
          <nav class="channels" aria-label="Social Media und Kontakt">
            <!-- LINKS -->
          </nav>
        </div>
      </div>
    </section>

    <section id="beitraege" class="wrap recipes" aria-labelledby="recipes-title">
      <div class="recipes-heading">
        <h2 id="recipes-title">Rezepte &amp; Beiträge</h2>
        <div class="feed-tabs" role="tablist" aria-label="Plattform auswählen" hidden>
          <button type="button" id="instagram-tab" role="tab" aria-controls="instagram-panel" aria-selected="true">Instagram</button>
          <button type="button" id="tiktok-tab" role="tab" aria-controls="tiktok-panel" aria-selected="false" tabindex="-1">TikTok</button>
        </div>
      </div>
      <div id="instagram-panel" role="tabpanel" aria-labelledby="instagram-tab" tabindex="0">
        <p class="feed-empty">Hier erscheinen meine Instagram-Beiträge.</p>
        <ul id="instagram-grid" class="feed-grid" hidden></ul>
        <button class="feed-more" type="button" aria-controls="instagram-grid" hidden>Mehr Beiträge</button>
      </div>
      <div id="tiktok-panel" role="tabpanel" aria-labelledby="tiktok-tab" tabindex="0" hidden>
        <p class="feed-empty"><a href="https://www.tiktok.com/@juka.cooking">Videos auf TikTok ansehen</a></p>
        <ul class="feed-grid" hidden></ul>
      </div>
    </section>

    <!-- PARTNERLINKS -->
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <a class="brand" href="#start">juka<span>.</span>cooking</a>
      <nav aria-label="Rechtliches">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>
</body>
</html>
